<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Your Pattern — vertical deck</title>
<style>
  :root{
    --bg:#F4F5F7; --card:#FFFFFF; --ink:#18181B; --mut:#73726E; --line:#DEDEDC;
    --lift:#FFFFFF; --body:#3f3f45; --gold:#6b5d1f; --accent:#262000; --default:#F1EBDF; --danger:#FB3277;
    --serif: "Parkinsans", system-ui, sans-serif;
    --heading: "Parkinsans", system-ui, sans-serif;
    --sans: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;}
  #screen{position:relative;width:100%;min-height:100dvh;background:var(--bg);overflow:hidden;}
  @media (min-width:540px) and (min-height:600px){
    body{background:#17171A;height:100dvh;overflow:hidden;}
    #screen{width:390px;height:844px;min-height:0;border-radius:34px;
      box-shadow:0 22px 60px rgba(42,35,32,.30),0 0 0 1px rgba(42,35,32,.05);}
  }
  .layer{position:absolute;inset:0;overflow:hidden;isolation:isolate;}
  #l1,#l2{transition:transform .5s cubic-bezier(.3,0,.22,1),opacity .4s ease;transform-origin:center 42%;}
  #l1.diveout{transform:scale(1.12);opacity:0;}        /* landing rushes past as you descend */
  #l1.fadeout{opacity:0;transition:opacity .22s ease;} /* landing dissolves quickly, then the deck dives in */
  #l2.divein{transform:scale(.9);opacity:0;}            /* deck emerges up from depth */
  .hidden{display:none;}

  .statusbar{height:calc(env(safe-area-inset-top,0px) + 14px);}
  .toolbar{display:flex;align-items:center;gap:10px;padding:0 16px 8px;}
  .round{width:36px;height:36px;border-radius:50%;border:none;background:var(--default);
    display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;padding:0;font-size:17px;flex:0 0 auto;}
  .round svg{width:20px;height:20px;}
  #l2back svg,#l3back svg{width:23px;height:23px;}
  .tbtitle{font-weight:600;font-size:16px;white-space:nowrap;}
  .tbspacer{flex:1;}

  /* LAYER 1 */
  #l1 .l1top{display:flex;align-items:center;padding:0 20px 8px;}
  #l1 .l1title{font-family:var(--heading);font-weight:700;font-size:26px;color:var(--ink);}
  #l1search{width:36px;height:36px;background:var(--default);border:none;}
  #l1search svg{width:22px;height:22px;}
  #l1 .l1avatar{width:36px;height:36px;position:relative;border:none;background:none;padding:0;cursor:pointer;margin-left:10px;flex:0 0 auto;}
  #l1 .l1avatar .pic{width:36px;height:36px;border-radius:50%;overflow:hidden;background:linear-gradient(140deg,#ece3d2,#cdbd9f);display:flex;align-items:flex-end;justify-content:center;}
  #l1 .l1avatar .pers{width:30px;height:30px;color:#a6987e;}
  #l1 .l1avatar .dot{position:absolute;right:-1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--card);}
  #l1 .l1sec{text-align:center;padding:16px 24px 18px;}
  #l1 .l1h{font-family:var(--heading);font-weight:700;font-size:28px;color:var(--ink);margin:0 0 6px;}
  #l1 .l1sub{font-size:15px;color:var(--mut);}
  #carwrap{position:absolute;left:0;right:0;overflow:hidden;}
  #cartrack{position:absolute;inset:0;}
  .pcard2{position:absolute;top:0;left:0;height:212px;box-sizing:border-box;
    transition:transform .32s cubic-bezier(.3,0,.2,1);will-change:transform;
    background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 16px;
    display:flex;flex-direction:column;justify-content:center;box-shadow:0 8px 22px rgba(24,24,27,.06);cursor:pointer;}
  .pcard2 .cg{align-self:center;display:inline-flex;align-items:center;gap:5px;background:var(--default);border-radius:999px;padding:5px 11px;font-size:15px;color:var(--ink);line-height:1;}
  .pcard2 .cplace{text-align:center;font-size:15px;color:var(--mut);margin-top:0;}
  .pcard2 .cmean{text-align:center;font-family:var(--heading);font-weight:700;font-size:23px;line-height:1.18;color:var(--ink);margin-top:7px;}
  .pcard2 .cnext{margin-top:26px;background:var(--default);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;}
  .pcard2 .cnext .col{flex:1;min-width:0;}
  .pcard2 .cnext .lbl{font-size:13px;color:var(--mut);margin-bottom:2px;}
  .pcard2 .cnext .nm{font-weight:700;font-size:15px;color:var(--ink);line-height:1.25;}
  .pcard2 .cnext .chev{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--mut);}
  .pcard2 .cnext .chev svg{width:22px;height:22px;}

  /* LAYER 2 strip */
  #chipwrap{position:relative;height:54px;overflow:hidden;margin-top:2px;}
  #chiptrack{position:absolute;inset:0;}
  .chip{position:absolute;top:8px;left:0;height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 7px;
    border:none;background:none;cursor:pointer;white-space:nowrap;color:var(--ink);font:inherit;border-radius:999px;
    transition:transform .32s cubic-bezier(.3,0,.2,1);will-change:transform;}
  .chip .cgl{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--default);color:var(--ink);flex:0 0 auto;}
  .chip .clbl{font-size:15px;font-weight:600;color:var(--ink);}
  .chip.on{background:var(--accent);}
  .chip.on .clbl{color:#FCFCFC;}
  .chip.on .cgl{background:rgba(255,255,255,.2);color:#FCFCFC;}

  #feedZone{position:absolute;left:0;right:0;overflow:hidden;z-index:1;}
  #feed{position:absolute;inset:0;transition:transform .34s cubic-bezier(.3,0,.2,1);transform-origin:50% 46%;}
  #feed.zoomed{transform:scale(.86);}

  .pcard{position:absolute;left:12px;right:12px;top:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 20px 30px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(42,35,32,.12);
    transition:transform .52s cubic-bezier(.4,0,.22,1),opacity .4s ease;will-change:transform,opacity;}
  .pcard.d0{transform:translateY(0) scale(1);opacity:1;z-index:30;}
  .pcard.d1{transform:translateY(28px) scale(.955);opacity:.9;z-index:20;pointer-events:none;}
  .pcard.d2{transform:translateY(52px) scale(.91);opacity:.66;z-index:10;pointer-events:none;}
  @keyframes cardToBack{
    0%{transform:translateY(0) scale(1);opacity:1;}
    34%{transform:translateY(-68px) scale(.97);opacity:1;}
    62%{transform:translateY(-16px) scale(.8);opacity:.9;}
    100%{transform:translateY(52px) scale(.9);opacity:.66;}
  }
  @keyframes cardFromBack{
    0%{transform:translateY(52px) scale(.9);opacity:.66;}
    50%{transform:translateY(-62px) scale(.98);opacity:1;}
    100%{transform:translateY(0) scale(1);opacity:1;}
  }
  .pcard.toBack{animation:cardToBack .6s cubic-bezier(.42,0,.22,1) forwards;}
  .pcard.fromBack{animation:cardFromBack .6s cubic-bezier(.42,0,.22,1) forwards;}
  .ctoprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;min-height:34px;}
  .cglyphs{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:16px;color:var(--ink);}
  .cglyphs-empty{display:inline-block;}
  .ctagwrap{display:flex;align-items:center;gap:9px;}
  .ctag{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut);}
  .ctag svg{width:15px;height:15px;stroke:var(--mut);flex:0 0 auto;}
  .ctag.lock{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .cring svg{width:26px;height:26px;display:block;}
  .peyebrow{font-size:14px;letter-spacing:.01em;color:var(--mut);margin-bottom:8px;}
  .ptitle{font-family:var(--heading);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.02em;margin:0 0 14px;}
  .pbody{font-size:16.5px;line-height:1.52;color:var(--body);margin:0;}
  .pmore{color:var(--mut);font-size:17px;line-height:1;margin-top:14px;letter-spacing:2px;}
  .pcard .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:24px;}
  .cutil{display:flex;align-items:center;justify-content:center;gap:34px;}
  .cutil button{background:none;border:none;padding:0;margin:0;cursor:pointer;color:var(--ink);position:relative;display:inline-flex;align-items:center;justify-content:center;}
  .cutil svg{width:23px;height:23px;stroke:var(--ink);fill:none;}
  .cutil .ccount{position:absolute;top:-10px;left:14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 6px;font-size:11px;font-weight:600;color:var(--ink);}
  .pcta{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:36px;background:var(--accent);color:#FCFCFC;border:none;border-radius:999px;padding:0 26px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;}
  .pcta.ghost{background:none;color:var(--ink);border:1px solid var(--line);}
  .pcta.text{background:none;color:var(--ink);border:none;padding:8px;font-weight:600;}
  .pcta .arw{font-size:15px;}
  .pcard.tout{text-align:center;align-items:center;}
  .pcard.tout .ptitle,.pcard.tout .pbody{max-width:30ch;}
  .pcard.tout .foot{margin-top:0;gap:8px;padding-top:30px;}
  .touthero{width:100%;background:linear-gradient(180deg,#f7f2e8,#efe8da);border-radius:16px;padding:26px 22px 30px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;gap:18px;}
  .touthero.gfx{min-height:132px;background:var(--default);color:#c3b49b;padding:0;}
  .touthero.gfx svg{width:52px;height:44px;}
  .touthero .av{width:78px;height:78px;border-radius:50%;background:var(--card);border:1px solid var(--line);position:relative;box-shadow:0 4px 12px rgba(42,35,32,.10);}
  .touthero .amp{font-family:var(--serif);font-size:26px;color:var(--mut);}
  .touthero .nm{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 9px;white-space:nowrap;}
  .touthero .nm.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);}

  .deckarrow{position:absolute;left:50%;transform:translateX(-50%);z-index:70;width:50px;height:32px;
    display:flex;align-items:center;justify-content:center;background:none;border:none;
    color:var(--ink);opacity:.38;cursor:pointer;transition:opacity .2s ease;-webkit-tap-highlight-color:transparent;}
  .deckarrow svg{width:26px;height:26px;stroke:var(--ink);fill:none;}
  .deckarrow:active{opacity:.85;}
  .deckarrow.up{top:0;}
  .deckarrow.down{bottom:3px;}
  body.no-arrows .deckarrow{display:none!important;}

  #fabs{position:absolute;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px) + 10px);z-index:11;display:flex;flex-direction:column;gap:9px;}
  .fab{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;opacity:.92;padding:0;}

  .tabbar{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:10;
    display:flex;align-items:stretch;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 6px 20px rgba(42,35,32,.13);}
  .tabbar .tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--ink);font:inherit;font-size:10.5px;font-weight:600;letter-spacing:.01em;padding:6px 0;border-radius:999px;}
  .tabbar .tab .ti{width:21px;height:20px;display:flex;align-items:center;justify-content:center;}
  .tabbar .tab .ti svg{width:20px;height:20px;stroke:currentColor;fill:none;}
  .tabbar .tab .tabav{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#d9cfbd,#bfae94);border:1px solid var(--line);}
  .tabbar .tab.on{background:var(--lift);color:var(--gold);box-shadow:0 2px 8px rgba(42,35,32,.12);}

  #sheetScrim{position:absolute;inset:0;background:rgba(42,35,32,.34);opacity:0;pointer-events:none;transition:opacity .28s;z-index:30;}
  #sheetScrim.open{opacity:1;pointer-events:auto;}
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:22px 22px 0 0;
    transform:translateY(101%);transition:transform .3s cubic-bezier(.34,1.06,.4,1);padding:12px 0 calc(20px + env(safe-area-inset-bottom,0px));max-height:70%;overflow:auto;}
  #sheet.open{transform:translateY(0);}
  #sheet .grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px;}
  #sheet h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 6px;padding:0 20px;}
  .sitem{display:flex;gap:12px;align-items:baseline;padding:13px 20px;border-top:1px solid var(--line);cursor:pointer;}
  .sitem .n{color:var(--mut);font-size:13px;width:16px;}
  .sitem .t{font-size:16px;}
  .sitem.on .t{font-weight:600;}
  .sitem .t small{display:block;color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px;}

  /* LAYER 3 */
  #l3{z-index:40;background:var(--bg);transform:scale(1.04);opacity:0;transition:opacity .32s ease,transform .34s cubic-bezier(.34,1,.4,1);pointer-events:none;}
  #l3.show{opacity:1;transform:scale(1);pointer-events:auto;}
  #rhead{position:absolute;left:0;right:0;text-align:center;padding:6px 30px 0;transition:opacity .2s ease;z-index:2;}
  #rhead .rglyph{display:inline-flex;align-items:center;gap:6px;background:var(--default);border-radius:999px;padding:5px 13px;font-size:15px;color:var(--ink);line-height:1;margin-bottom:14px;}
  #rhead .reyebrow{font-size:13px;color:var(--mut);margin-bottom:6px;}
  #rhead h2{font-family:var(--heading);font-weight:700;font-size:26px;line-height:1.15;margin:0;color:var(--ink);}
  #rtrackWrap{position:absolute;left:0;right:0;top:260px;bottom:200px;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;scrollbar-width:none;}
  #rtrackWrap::-webkit-scrollbar{display:none;}
  .rslide{flex:0 0 100%;scroll-snap-align:start;height:100%;display:flex;align-items:center;padding:0 30px;}
  .rslide p{font-size:16px;line-height:24px;color:var(--ink);margin:0;text-align:left;width:100%;}
  .rslide.end{justify-content:center;text-align:center;}
  .rslide.end .rendinner{margin:auto 0;display:flex;flex-direction:column;align-items:center;width:100%;}
  .rslide.end .done{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;}
  .rslide.end h2{font-family:var(--heading);font-weight:700;font-size:26px;line-height:1.15;margin:0 0 26px;}
  .rslide.end h2 .nextlbl{color:var(--mut);font-weight:600;}
  .rslide.end .endctas{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;}
  .rslide.end .pcta{width:min(300px,84%);justify-content:center;}
  #rfoot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;align-items:center;gap:18px;z-index:3;}
  #rdotswrap{width:108px;overflow:hidden;display:flex;justify-content:center;}
  #rdots{display:flex;gap:7px;align-items:center;transition:transform .2s cubic-bezier(.3,0,.2,1);}
  #rdots b{width:7px;height:7px;border-radius:50%;background:var(--line);display:block;flex:0 0 auto;transition:background .2s ease;}
  #rdots b.on{background:var(--ink);width:20px;height:7px;border-radius:3.5px;}
  #rdots b.sm{width:5px;height:5px;}
  #rdots b.xs{width:3px;height:3px;}
  #rfoot .rutil{display:flex;gap:38px;align-items:center;}
  #rfoot .rutil button{background:none;border:none;color:var(--ink);display:inline-flex;align-items:center;cursor:pointer;padding:0;position:relative;}
  #rfoot .rutil svg{width:23px;height:23px;}
  #rfoot .rutil .ccount{position:absolute;top:-7px;left:13px;background:var(--ink);color:var(--card);font-size:10px;font-weight:600;border-radius:9px;padding:1px 5px;line-height:1.4;}
  #rpattern{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;}
  #rpattern .pravatars{display:flex;align-items:center;padding-left:8px;}
  #rpattern .pravatars .av{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink);flex:0 0 auto;}
  #rpattern .pravatars .more{background:var(--default);}
  #rpattern .prlabel{font-size:14px;font-weight:500;color:var(--ink);}

  @media (prefers-reduced-motion:reduce){#feed,.pcard,#l3{transition:none!important;} #rtrackWrap{scroll-behavior:auto;}}


  #aifab{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:50;width:36px;height:36px;border-radius:50%;
    background:var(--accent);color:#FCFCFC;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 22px rgba(38,32,0,.34);transition:transform .22s cubic-bezier(.2,.8,.25,1),opacity .18s;}
  #aifab svg{width:26px;height:26px;}
  #aifab.hide{opacity:0;transform:scale(.5);pointer-events:none;}
  #aiscrim{position:absolute;inset:0;background:rgba(24,24,27,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:51;}
  #aiscrim.open{opacity:1;pointer-events:auto;}
  #aipanel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:52;
    background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 16px 44px rgba(24,24,27,.24);
    transform:translateY(20px) scale(.94);transform-origin:bottom right;opacity:0;pointer-events:none;
    transition:transform .28s cubic-bezier(.2,.8,.25,1),opacity .2s;}
  #aipanel.open{transform:none;opacity:1;pointer-events:auto;}
  #aipanel .aihead{display:flex;align-items:center;justify-content:space-between;font-family:var(--heading);font-weight:700;font-size:16px;color:var(--ink);margin-bottom:12px;}
  #aipanel #aiclose{background:none;border:none;color:var(--mut);font-size:15px;cursor:pointer;padding:4px;line-height:1;}
  #aipanel .aiprompts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  #aipanel .aiprompt{text-align:left;background:var(--default);border:none;border-radius:14px;padding:12px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;}
  #aipanel .aiinput{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px;}
  #aipanel .aiinput input{flex:1;border:none;background:none;font:inherit;font-size:14px;color:var(--ink);outline:none;}
  #aipanel .aiinput input::placeholder{color:var(--mut);}
  #aipanel .aisend{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#FCFCFC;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  #aipanel .aisend svg{width:18px;height:18px;}

  .pcard.end{justify-content:center;}
  .pcard.end .touthero{width:120px;height:120px;min-height:0;margin:0 auto 26px;padding:0;}
  .pcta.soft{background:var(--default);color:var(--ink);border:none;}

  #jell{position:absolute;left:0;right:0;}
  #jorbit{position:absolute;inset:0;width:100%;height:100%;}
  #jnodes{position:absolute;inset:0;}
  #jcenter{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;z-index:50;box-shadow:0 0 34px 10px rgba(255,214,130,.42);}
  #jcenter .pic{width:64px;height:64px;border-radius:50%;overflow:hidden;background:linear-gradient(140deg,#ece3d2,#cdbd9f);display:flex;align-items:flex-end;justify-content:center;}
  #jcenter .pers{width:54px;height:54px;color:#a6987e;}
  .enode{position:absolute;top:0;left:0;width:54px;display:flex;flex-direction:column;align-items:center;cursor:pointer;
    transform-origin:27px 27px;transition:transform .42s cubic-bezier(.3,0,.2,1),opacity .35s ease;will-change:transform,opacity;}

  NC=PLACEMENTS.length;
  chiptrack.innerHTML=PLACEMENTS.map((p,i)=>'<button class="chip'+(i===chipA?' on':'')+'" data-c="'+i+'"><span class="cgl">'+G(p.g.split(" ")[0])+'</span><span class="clbl">'+p.mean+'</span></button>').join("");
  chipEls=[...chiptrack.querySelectorAll(".chip")];
  chipEls.forEach((el,i)=>el.addEventListener("click",()=>{ if(chipMoved) return; const d=chipDelta(i); if(d) chipGo(d); }));
  measureChips();
}
function measureChips(){
  chipW=chipEls.map(el=>el.offsetWidth);
  const G=12; chipS=chipW.reduce((a,b)=>a+b,0)+NC*G;
  let acc=0; chipCent=chipW.map(w=>{ const c=acc+w/2; acc+=w+G; return c; });
  positionChips(true);
}
function chipX(i,a){
  let rel=chipCent[i]-chipCent[a];
  while(rel>chipS/2) rel-=chipS; while(rel<-chipS/2) rel+=chipS;
  return screenEl.clientWidth/2 + rel - chipW[i]/2;
}
function positionChips(instant){
  chipEls.forEach((el,i)=>{ if(instant) el.style.transition="none"; el.style.transform="translateX("+chipX(i,chipA)+"px)"; });
  if(instant) requestAnimationFrame(()=>chipEls.forEach(el=>el.style.transition=""));
}
function chipDelta(i){ let d=i-chipA; while(d>NC/2) d-=NC; while(d<-NC/2) d+=NC; return d; }
function chipGo(dir){
  if(chipBusy) return; chipBusy=true;
  const na=((chipA+dir)%NC+NC)%NC, W=screenEl.clientWidth;
  chipEls.forEach((el,i)=>{
    const oldX=chipX(i,chipA), newX=chipX(i,na);
    if(Math.abs(newX-oldX)>W){ el.style.transition="none"; el.style.transform="translateX("+newX+"px)"; el.offsetWidth; el.style.transition=""; }
    else el.style.transform="translateX("+newX+"px)";
  });
  chipA=na; chipEls.forEach((el,i)=>el.classList.toggle("on",i===chipA));
  slideDeck(dir);   // shift the whole card stack out and a fresh deck in
}
function slideDeck(dir){
  const W=screenEl.clientWidth;
  feed.style.transition="transform .24s cubic-bezier(.4,0,1,.55)";   // current deck slides out the way you swiped
  feed.style.transform="translateX("+(dir>0?-W:W)+"px)";
  setTimeout(()=>{
    loadPlacement(chipA); focusIdx=0; measure(); renderDeck();       // build the new placement's deck
    feed.style.transition="none";                                    // drop it in off-screen on the opposite side
    feed.style.transform="translateX("+(dir>0?W:-W)+"px)";
    feed.offsetHeight;                                               // commit before animating
    feed.style.transition="transform .34s cubic-bezier(.16,.84,.3,1)";
    feed.style.transform="translateX(0)";                            // new deck slides in
    setTimeout(()=>{ feed.style.transition=""; feed.style.transform=""; chipBusy=false; },360);
  },250);
}
/* swipe + two-finger trackpad on the chips indexes the placement */
let chx0=null,chy0=null;
chipwrap.addEventListener("touchstart",e=>{ chx0=e.touches[0].clientX; chy0=e.touches[0].clientY; chipMoved=false; },{passive:true});
chipwrap.addEventListener("touchmove",e=>{ if(chx0!=null && Math.abs(e.touches[0].clientX-chx0)>8) chipMoved=true; },{passive:true});
chipwrap.addEventListener("touchend",e=>{ if(chx0==null) return; const dx=e.changedTouches[0].clientX-chx0, dy=e.changedTouches[0].clientY-chy0; chx0=null; if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) chipGo(dx<0?1:-1); },{passive:true});
let chipWheelLock=false;
chipwrap.addEventListener("wheel",e=>{ if(chipBusy||chipWheelLock) return; if(Math.abs(e.deltaX)>Math.abs(e.deltaY)+2 && Math.abs(e.deltaX)>16){ chipWheelLock=true; setTimeout(()=>{chipWheelLock=false;},380); chipGo(e.deltaX>0?1:-1); } },{passive:true});

  }
  const audio=c.mode==="audio", isLocked=c.type==="locked";

    '</div>';
  const cta = isLocked ? "Unlock with Premium" : (audio?"Listen":"Read Insight");
  const more = isLocked ? "" : '<div class="pmore">&#8230;</div>';
  return '<div class="pcard'+(isLocked?" locked":"")+'" data-i="'+i+'" style="height:'+cardH+'px">'+
    '<div class="ctoprow">'+glyphs+tag+'</div>'+
    '<div class="peyebrow">'+c.eyebrow+'</div><div class="ptitle">'+c.title+'</div>'+
    '<p class="pbody">'+c.body+'</p>'+more+
    '<div class="foot"><button class="pcta" data-cta="'+i+'">'+cta+'</button>'+util+'</div></div>';
}
function measure(){
  const H=screenEl.clientHeight;
  const small=H<720;                               // phone viewport shrunk by browser chrome
  const tabbarH=small?70:80, topGap=small?16:36, peek=small?40:58;
  const headerH=$("#l2 .statusbar").offsetHeight+$("#l2 .toolbar").offsetHeight+$("#chipwrap").offsetHeight;
  const zoneH=H-headerH-topGap-tabbarH;
  cardH=Math.max(280,zoneH-peek);   // reserve room below for the deck peek
  feedZone.style.top=(headerH+topGap)+"px"; feedZone.style.height=zoneH+"px";
  const au=$("#arrUp"); if(au) au.style.top=(headerH+2)+"px";
}
function buildFeed(){ measure(); renderDeck(); }
function applyMode(){}
function makeCard(idx,depth){
  const wrap=document.createElement("div"); wrap.innerHTML=cardHTML(CARDS[idx],idx);
  const card=wrap.firstElementChild; card.classList.add("d"+depth); return card;
}
function wireDeck(){
  feed.querySelectorAll("[data-cta]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); const c=CARDS[+b.dataset.cta];
    if(c.reader) openReader(c);
    else if(c.type==="tout"){ if(c.chat) openAI(); else toast("Would "+(c.cta||"take action").toLowerCase()); }
    else if(c.type==="continue") toast("Would advance to your Venus");
    else if(c.type==="locked") toast("Premium, would open the paywall");
  }));
  feed.querySelectorAll("[data-skip]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); advance(1); }));
  feed.querySelectorAll("[data-nextplace]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); chipGo(1); }));
  feed.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); exitToL1(); }));
  feed.querySelectorAll("[data-u]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); toast(b.dataset.u==="save"?"Saved":"Shared"); }));
}
function renderDeck(){
  const N=CARDS.length; focusIdx=((focusIdx%N)+N)%N;
  feed.innerHTML="";
  const n=Math.min(3,N);
  for(let d=0; d<n; d++){ feed.appendChild(makeCard((focusIdx+d)%N,d)); }
  wireDeck();
}
function goTo(i){ const N=CARDS.length; focusIdx=((i%N)+N)%N; renderDeck(); }
let deckBusy=false;

// current card goes out and around to the back; next rises; deck loops
function commitAround(){
  if(deckBusy) return;
  const card=feed.querySelector(".d0"); if(!card) return;
  deckBusy=true;
  feed.classList.add("zoomed"); feedZone.style.overflow="visible";                     // zoom out so the vertical move reads
  const F=focusIdx, N=CARDS.length, swapIdx=(F+3)%N;
  card.classList.remove("d0"); card.style.zIndex="60"; card.classList.add("toBack");
  setTimeout(()=>{ if(card.isConnected) card.style.zIndex="1"; },200);                 // recede behind partway through
  const swap=makeCard(swapIdx,2);
  setTimeout(()=>{ if(card.isConnected){ card.innerHTML=swap.innerHTML; card.dataset.i=swapIdx; } },300);
  const d1=feed.querySelector(".d1"), d2=feed.querySelector(".d2");
  if(d1){ d1.classList.remove("d1"); d1.classList.add("d0"); }                          // next rises to the top
  if(d2){ d2.classList.remove("d2"); d2.classList.add("d1"); }
  focusIdx=(F+1)%N;
  setTimeout(()=>{ deckBusy=false; feed.classList.remove("zoomed"); feedZone.style.overflow=""; renderDeck(); },640);
}
function doNext(){ commitAround(); }
// mirror: the bottom card rises up from behind and over the top of the deck
function commitBack(){
  if(deckBusy) return;
  deckBusy=true;
  feed.classList.add("zoomed"); feedZone.style.overflow="visible";
  const N=CARDS.length, prevIdx=(focusIdx-1+N)%N;
  const d0=feed.querySelector(".d0"), d1=feed.querySelector(".d1"), d2=feed.querySelector(".d2");
  if(d0){ d0.classList.remove("d0"); d0.classList.add("d1"); }                          // steps back
  if(d1){ d1.classList.remove("d1"); d1.classList.add("d2"); }
  if(d2){ d2.classList.remove("d2"); d2.style.transition="transform .5s cubic-bezier(.4,0,.22,1),opacity .3s ease"; d2.style.transform="translateY(84px) scale(.84)"; d2.style.opacity="0"; }
  const inc=makeCard(prevIdx,0); inc.style.zIndex="1"; inc.classList.add("fromBack");
  feed.appendChild(inc);
  setTimeout(()=>{ if(inc.isConnected) inc.style.zIndex="60"; },260);                    // comes over the top partway through
  focusIdx=prevIdx;
  setTimeout(()=>{ deckBusy=false; feed.classList.remove("zoomed"); feedZone.style.overflow=""; renderDeck(); },660);
}
function doPrev(){ commitBack(); }
function advance(dir){ if(chipBusy) return; if(dir>0) doNext(); else doPrev(); }

/* auto-cycle: a single served-next step, only when a reader is closed */
function serveNext(){ doNext(); }

/* swipe: a vertical flick fires the same animation as the arrows */
let sx=null, sy=null;
feedZone.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
feedZone.addEventListener("touchend",e=>{
  if(sy==null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sy=null;
  if(Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)){ chipGo(dx<0?1:-1); return; }   // horizontal = placement (chips)
  if(Math.abs(dy)<44 || Math.abs(dy)<Math.abs(dx)) return;   // vertical flick only
  advance(dy<0?1:-1);                                        // swipe up = next, down = previous
},{passive:true});
let wheelLock=false;
feedZone.addEventListener("wheel",e=>{                        // trackpad two-finger swipe
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)+2 && Math.abs(e.deltaX)>16){   // horizontal = placement (chips)
    if(chipBusy||chipWheelLock) return;
    chipWheelLock=true; setTimeout(()=>{ chipWheelLock=false; },420);
    chipGo(e.deltaX>0?1:-1); return;
  }
  if(deckBusy||wheelLock) return;
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)+2 && Math.abs(e.deltaY)>16){
    wheelLock=true; setTimeout(()=>{ wheelLock=false; },660);
    advance(e.deltaY>0?1:-1);                                // scroll down = next
  }
},{passive:true});

let rslides=[], rIdx=0;
const rw=$("#rtrackWrap");
let rContentN=0;
function setDots(){
  const dd=$("#rdots"); if(!dd) return;
  const kids=[...dd.children];
  kids.forEach((b,i)=>{ const d=Math.abs(i-rIdx); b.className=(i===rIdx)?"on":(d<=2?"":(d===3?"sm":"xs")); });
  const active=kids[rIdx], wrap=$("#rdotswrap");
  if(active&&wrap){ const off=active.offsetLeft+active.offsetWidth/2; dd.style.transform="translateX("+(wrap.clientWidth/2-off)+"px)"; }
  const rh=$("#rhead"); if(rh){ const onEnd=rIdx>=rContentN; rh.style.opacity=onEnd?"0":"1"; rh.style.pointerEvents=onEnd?"none":""; }
}

function openReader(c){
  const key=(typeof c==="string")?c:c.reader;
  const r=READERS[key]; if(!r){ toast("Reader coming"); return; }
  const glyphs=(c&&c.glyphs)||"";
  rContentN=r.slides.length;
  $("#rhead").innerHTML=(glyphs?'<span class="rglyph">'+G(glyphs)+'</span>':'')+'<div class="reyebrow">'+r.eyebrow+'</div><h2>'+r.title+'</h2>';
  let html=r.slides.map(t=>'<div class="rslide"><p>'+t+'</p></div>').join("");
  const cur=PLACEMENTS[chipA].place.split(" in ")[0];
  const nm=nextInsightIdx(focusIdx);
  const nextTitle=nm>-1 ? (CARDS[nm].title+(CARDS[nm].mode==="audio"?" (Audio)":"")) : ("your "+cur);
  const nextPlace=PLACEMENTS[(chipA+1)%NP].place.split(" in ")[0];
  html+='<div class="rslide end"><div class="rendinner"><div class="done">Insight Completed</div>'+
    '<h2><span class="nextlbl">Next: </span>'+nextTitle+'</h2>'+
    '<div class="endctas">'+
      '<button class="pcta" data-end="moon">'+(nm>-1?("Next "+cur+" Insight"):("Back to your "+cur))+' <span class="arw">&#8595;</span></button>'+
      '<button class="pcta soft" data-end="venus">Move On to '+nextPlace+' <span class="arw">&#8594;</span></button>'+
    '</div></div></div>';
  rw.innerHTML=html;
  buildReaderFooter(rContentN+1);
  rw.querySelectorAll("[data-end]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); closeReaderThen(b.dataset.end); }));
  rslides=[...rw.querySelectorAll(".rslide")]; rIdx=0; rw.scrollLeft=0;
  const l3=$("#l3"); l3.classList.remove("hidden");                        // show (opacity 0) so we can measure
  const tb=$("#l3 .statusbar").offsetHeight+$("#l3 .toolbar").offsetHeight;
  $("#rhead").style.top=tb+"px";
  rw.style.top=(tb+$("#rhead").offsetHeight+10)+"px";                      // track starts just below the sticky header
  setDots();
  requestAnimationFrame(()=>{ l3.classList.add("show"); requestAnimationFrame(setDots); });   // recompute once laid out, so page 1 renders right
}
function rGo(i){ rIdx=Math.max(0,Math.min(rslides.length-1,i)); rw.scrollTo({left:rIdx*rw.clientWidth,behavior:"smooth"}); setDots(); }
function rAdvance(dir){ rGo(rIdx+dir); }
let rRaf=0;
rw.addEventListener("scroll",()=>{ if(rRaf) return; rRaf=requestAnimationFrame(()=>{ rRaf=0; if(rw.clientWidth){ const ni=Math.round(rw.scrollLeft/rw.clientWidth); if(ni!==rIdx){ rIdx=ni; setDots(); } } }); },{passive:true});
rw.addEventListener("click",e=>{ if(e.target.closest("button")) return; const b=rw.getBoundingClientRect(); rAdvance((e.clientX-b.left) > b.width*0.32 ? 1 : -1); });
document.addEventListener("keydown",e=>{ if(!$("#l3").classList.contains("show")) return; if(e.key==="ArrowRight") rAdvance(1); else if(e.key==="ArrowLeft") rAdvance(-1); });
function hideL3(){ const l3=$("#l3"); l3.classList.remove("show"); setTimeout(()=>l3.classList.add("hidden"),340); }
function nextInsightIdx(from){ for(let i=from+1;i<CARDS.length;i++) if(CARDS[i].type==="insight") return i; return -1; }
function landOn(i){ focusIdx=Math.max(0,Math.min(CARDS.length-1,i)); goTo(focusIdx); }
function closeReader(){ hideL3(); setTimeout(serveNext,420); }              /* back: dismiss, surface next card */
function closeReaderThen(kind){
  hideL3();
  if(kind==="venus"){ setTimeout(()=>chipGo(1),440); return; }   // move on to the next placement
  setTimeout(()=>{ commitAround(); },440);                        // next insight: the deck shuffles forward
}

/* nav */
function enterL2(idx){
  chipA=(((idx||0)%NP)+NP)%NP; loadPlacement(chipA); focusIdx=0;
  const l1=$("#l1"), l2=$("#l2");
  l2.classList.remove("hidden");
  l2.style.transition="none"; l2.classList.add("divein");     // snap the deck to its deep start (no flash at full size)
  buildChips(); buildFeed();
  l2.offsetHeight; l2.style.transition="";                    // commit, then re-enable transitions
  l1.classList.add("fadeout");                                // landing fades out first
  setTimeout(()=>{                                            // once it's gone, the deck dives in on its own
    l1.classList.add("hidden"); l1.classList.remove("fadeout");
    requestAnimationFrame(()=>requestAnimationFrame(()=>l2.classList.remove("divein")));
  },250);
}
function exitToL1(){
  const l1=$("#l1"), l2=$("#l2");
  l1.classList.remove("hidden"); l1.classList.add("diveout");   // landing sits just ahead, then settles back
  requestAnimationFrame(()=>requestAnimationFrame(()=>l1.classList.remove("diveout")));
  l2.classList.add("divein");                                   // deck sinks back into depth
  setTimeout(()=>{ l2.classList.add("hidden"); l2.classList.remove("divein"); },520);
}

if(/no[-_ ]?arrows/i.test(location.hash+location.search)) document.body.classList.add("no-arrows");

/* ---------- landing: virtual-circle placement carousel ---------- */
const PLACEMENTS=[
  {g:"\u263D \u264A", place:"Moon in Gemini", mean:"Instincts & Ego", next:"Free Spirited & Independent"},
  {g:"\u2640 \u264A", place:"Venus in Gemini", mean:"Identity & Growth", next:"Creative & Disciplined"},
  {g:"\u2642 \u264D", place:"Mars in Virgo", mean:"Attraction & Intimacy", next:"Live in Your Integrity"},
  {g:"Dc \u2651", place:"Descendant in Capricorn", mean:"Ideal Partner", next:"Reliable & Dependable"},
  {g:"\u2643 \u264D", place:"Jupiter in Virgo", mean:"Growth & Expansion", next:"Honoring Yourself"},
  {g:"\u263F \u264B", place:"Mercury in Cancer", mean:"Fears or Hesitations", next:"Fears or Hesitations"},
  {g:"Mc \u2648", place:"Midheaven in Aries", mean:"Your Career", next:"Committed & Assertive"},
  {g:"IC \u264E", place:"Imum Coeli in Libra", mean:"Your Most Private Self", next:"Your Most Private Self"},
  {g:"Ac \u264B", place:"Ascendant in Cancer", mean:"Your Destiny", next:"Sensitive & Open-Hearted"}
];
const carwrap=$("#carwrap"), cartrack=$("#cartrack"), NP=PLACEMENTS.length;
const ell=$("#jell"), enw=$("#jnodes"), jorbit=$("#jorbit"); let eEls=[], eMoved=false, eSpinning=false, eCx=0,eCy=0,eRx=0,eRy=0;
let center=0, carCW=0, carGAP=20, carBusy=false, carMoved=false, carCards=[];
function carCard(p){
  return '<div class="pcard2">'+
    '<div class="cplace">'+p.place+'</div><div class="cmean">'+p.mean+'</div>'+
    '<div class="cnext"><span class="col"><div class="lbl">Next Up:</div><div class="nm">'+p.next+'</div></span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></div></div>';
}
function wrapOff(d){ d=((d%NP)+NP)%NP; if(d>NP/2) d-=NP; return d; }        // nearest signed slot around center
function slotX(off){ return Math.round(screenEl.clientWidth/2 - carCW/2 + off*(carCW+carGAP)); }
function measureCar(){
  const W=screenEl.clientWidth;
  const top=$("#l1 .statusbar").offsetHeight+$("#l1 .l1top").offsetHeight+$("#l1 .l1sec").offsetHeight;
  eRx=Math.min(W*0.42,180); eRy=Math.round(eRx*0.56);            // foreshortened: wider than tall, a tilted plane
  const ellTop=top+8, ellH=2*eRy+100;
  ell.style.top=ellTop+"px"; ell.style.height=ellH+"px";
  eCx=W/2; eCy=Math.round(ellH*0.46);
  jorbit.setAttribute("viewBox","0 0 "+W+" "+ellH);
  jorbit.innerHTML='<ellipse cx="'+eCx+'" cy="'+eCy+'" rx="'+eRx+'" ry="'+eRy+'" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="1"/>';
  $("#jcenter").style.left=eCx+"px"; $("#jcenter").style.top=eCy+"px";
  carwrap.style.top=(ellTop+ellH+2)+"px"; carwrap.style.height="212px";
  carCW=Math.min(306, W-84);
  carCards.forEach((el,i)=>{ el.style.width=carCW+"px"; el.style.transition="none"; el.style.transform="translateX("+slotX(wrapOff(i-center))+"px)"; });
  requestAnimationFrame(()=>carCards.forEach(el=>el.style.transition=""));
  updateEllipse(true);
}
/* ---------- journey ellipse: nodes orbit the centre and scale by depth, in sync with the cards ---------- */
function planetName(p){ return p.place.split(" in ")[0]; }
function buildEllipse(){
  enw.innerHTML=PLACEMENTS.map((p,i)=>
    '<div class="enode" data-e="'+i+'"><div class="ecirc">'+G(p.g.split(" ")[0])+'</div><div class="elabel">'+planetName(p).toUpperCase()+'</div></div>'
  ).join("");
  eEls=[...enw.querySelectorAll(".enode")];
  eEls.forEach((el,i)=>el.addEventListener("click",()=>{ if(eMoved) return; spinCWto(i); }));
}
function eDelta(i){ const a=((center%NP)+NP)%NP; let d=i-a; while(d>NP/2)d-=NP; while(d<-NP/2)d+=NP; return d; }
function updateEllipse(instant){
  const a=((center%NP)+NP)%NP, TWO=2*Math.PI/NP;
  eEls.forEach((el,i)=>{
    const ang=(i-center)*TWO;                       // 0 = front (bottom); grows clockwise
    const x=eCx+eRx*Math.sin(ang), y=eCy+eRy*Math.cos(ang);
    const depth=(Math.cos(ang)+1)/2;                // 1 at the front, 0 at the back
    const s=(0.6+0.4*depth).toFixed(3);
    if(instant) el.style.transition="none";
    el.style.transform="translate("+(x-27)+"px,"+(y-27)+"px) scale("+s+")";
    el.style.opacity=(0.5+0.5*depth).toFixed(3);
    el.style.zIndex=Math.round(depth*100);
    const on=(i===a); el.classList.toggle("on",on);
    el.querySelector(".elabel").textContent = on ? PLACEMENTS[i].place : planetName(PLACEMENTS[i]).toUpperCase();
    if(instant) el.offsetWidth;
  });
  if(instant) requestAnimationFrame(()=>eEls.forEach(el=>el.style.transition=""));
}
function buildCarousel(){
  cartrack.innerHTML=PLACEMENTS.map(carCard).join("");
  carCards=[...cartrack.querySelectorAll(".pcard2")];
  buildEllipse();
  carCards.forEach((el,i)=>el.addEventListener("click",()=>{
    if(carMoved) return;
    const off=wrapOff(i-center);          // click a peeking card to bring it in; click the centered card to enter
    if(off===0) enterL2(i); else carGo(off>0?1:-1);
  }));
  center=0; measureCar();
}
function advanceCenter(dir){
  const nc=center+dir;
  carCards.forEach((el,i)=>{
    const oldOff=wrapOff(i-center), newOff=wrapOff(i-nc);
    if(Math.abs(newOff-oldOff)>1){ el.style.transition="none"; el.style.transform="translateX("+slotX(newOff)+"px)"; el.offsetWidth; el.style.transition=""; }
    else el.style.transform="translateX("+slotX(newOff)+"px)";
  });
  center=nc;
  updateEllipse();
}
function carGo(dir){ if(carBusy||eSpinning) return; carBusy=true; advanceCenter(dir); setTimeout(()=>{ carBusy=false; },340); }
function spinCWto(i){                               // tap a node: roll the ring clockwise until it reaches the front
  if(carBusy||eSpinning) return;
  const a=((center%NP)+NP)%NP; let k=((i-a)%NP+NP)%NP;
  if(!k) return;
  eSpinning=true;
  const tick=()=>{ advanceCenter(1); if(--k>0) setTimeout(tick,120); else eSpinning=false; };
  tick();
}
/* swipe (touch) + two-finger trackpad (wheel deltaX); tap a card to drill in */
let cx0=null,cy0=null;
carwrap.addEventListener("touchstart",e=>{ cx0=e.touches[0].clientX; cy0=e.touches[0].clientY; carMoved=false; },{passive:true});
carwrap.addEventListener("touchmove",e=>{ if(cx0!=null && Math.abs(e.touches[0].clientX-cx0)>10) carMoved=true; },{passive:true});
carwrap.addEventListener("touchend",e=>{
  if(cx0==null) return;
  const dx=e.changedTouches[0].clientX-cx0, dy=e.changedTouches[0].clientY-cy0; cx0=null;
  if(Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)) carGo(dx<0?1:-1);
},{passive:true});
let carWheelLock=false;
carwrap.addEventListener("wheel",e=>{
  if(carBusy||carWheelLock) return;
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)+2 && Math.abs(e.deltaX)>16){
    carWheelLock=true; setTimeout(()=>{carWheelLock=false;},380);
    carGo(e.deltaX>0?1:-1);
  }
},{passive:true});
/* journey ellipse: same swipe + two-finger as the cards, plus tap a node to select it */
let ex0=null,ey0=null,eWheelLock=false;
ell.addEventListener("touchstart",e=>{ ex0=e.touches[0].clientX; ey0=e.touches[0].clientY; eMoved=false; },{passive:true});
ell.addEventListener("touchmove",e=>{ if(ex0!=null && Math.abs(e.touches[0].clientX-ex0)>8) eMoved=true; },{passive:true});
ell.addEventListener("touchend",e=>{ if(ex0==null) return; const dx=e.changedTouches[0].clientX-ex0, dy=e.changedTouches[0].clientY-ey0; ex0=null; if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) carGo(dx<0?1:-1); },{passive:true});
ell.addEventListener("wheel",e=>{ if(carBusy||eWheelLock) return; if(Math.abs(e.deltaX)>Math.abs(e.deltaY)+2 && Math.abs(e.deltaX)>16){ eWheelLock=true; setTimeout(()=>{eWheelLock=false;},400); carGo(e.deltaX>0?1:-1); } },{passive:true});
buildCarousel();
window.addEventListener("resize",()=>{ if(!$("#l1").classList.contains("hidden")){ measureCar(); } if(!$("#l2").classList.contains("hidden")){ measure(); feed.querySelectorAll(".pcard").forEach(el=>el.style.height=cardH+"px"); goTo(focusIdx,true); } });
</script>
</body>
</html>
